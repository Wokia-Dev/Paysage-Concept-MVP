<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4543"/>
      <stop offset="100%" stop-color="#15302F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8C8B5"/>
      <stop offset="100%" stop-color="#BFA98F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E3D9"/>
    </linearGradient>
  </defs>

  <!-- Background for maskable & standard icon -->
  <rect width="512" height="512" fill="url(#forestGrad)"/>

  <!-- Subtle concentric decorative ring (within safe zone) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#BFA98F" stroke-width="2" opacity="0.25"/>

  <!-- Stylized Landscape Emblem -->
  <g transform="translate(0, 10)">
    <!-- Base Hill left -->
    <path d="M120 340 C170 290 230 300 280 340 Z" fill="#BFA98F" opacity="0.35"/>
    <!-- Base Hill right -->
    <path d="M230 340 C280 280 350 290 392 340 Z" fill="#BFA98F" opacity="0.5"/>

    <!-- Main Leaf 1 (Left / Upward) -->
    <path d="M256 120 C256 120 170 190 180 280 C190 330 230 340 256 340 C256 270 256 210 256 120 Z" 
          fill="url(#goldGrad)"/>

    <!-- Main Leaf 2 (Right / Symmetrical & Modern) -->
    <path d="M256 120 C256 120 342 190 332 280 C322 330 282 340 256 340 C256 270 256 210 256 120 Z" 
          fill="url(#accentGrad)" opacity="0.95"/>

    <!-- Leaf Center Stem / Sprout -->
    <path d="M256 135 L256 345" stroke="#15302F" stroke-width="6" stroke-linecap="round"/>

    <!-- Terracotta Accent Seed / Sun Dot -->
    <circle cx="256" cy="98" r="16" fill="#C86D51"/>
  </g>
</svg>
